<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<title>Expoline — Harbor Luxe POS</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite"></div>

  <header id="app-header" class="app-header hidden">
    <div class="brand"><span class="brand-mark">◈</span><span class="brand-name">Expoline</span></div>
    <nav id="main-nav" class="main-nav" aria-label="Primary"></nav>
    <div class="header-right">
      <label class="offline-toggle" title="Force offline mode for demo (kill switch)">
        <input type="checkbox" id="force-offline">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span class="toggle-label">Offline&nbsp;demo</span>
      </label>
      <div class="user-chip" id="user-chip"></div>
      <button id="logout-btn" class="icon-btn" aria-label="Log out" title="Log out">⎋</button>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="./views/giftcards.js"></script>
  <script src="./views/loyalty.js"></script>
  <script src="./views/waitlist.js"></script>
  <script src="./views/cash.js"></script>
  <script src="./views/schedule.js"></script>
  <script src="./views/analytics.js"></script>
  <script src="./views/insights.js"></script>
  <script src="./views/notes.js"></script>
  <script src="./views/reviews.js"></script>
  <script src="./views/multisite.js"></script>
  <script src="./views/inventory.js"></script>
  <script src="./views/apidocs.js"></script>
  <script src="./views/parity_orders.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
